<!DOCTYPE html>
<html lang="de">
<head>
  <!-- ==== META & SICHERHEIT ==== -->
  <!-- Zeichensatz und mobile Darstellung -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Sicherheitsregel: Die Seite darf NUR eigene Dateien laden (keine Tracker, keine fremden Skripte/Fonts). -->
  <!-- "data:" ist nur fürs Favicon erlaubt. Formulare werden nirgendwohin verschickt. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <!-- Suchmaschinen: bitte nicht indexieren, die Seite ist nur für Jank -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Beim Klick auf externe Links wird keine Herkunfts-URL mitgeschickt -->
  <meta name="referrer" content="no-referrer">
  <!-- Farbe der Browserleiste auf dem Handy -->
  <meta name="theme-color" content="#09050f">
  <title>CUT FOR J4NK – Der Cutter-Contest</title>
  <meta name="description" content="Pitch: Der Cutter-Contest für J4nk's Chaos Stream.">
  <!-- Favicon als eingebettetes SVG (Blitz), damit keine extra Datei nötig ist -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2309050f'/%3E%3Cpath d='M19 2 6 18h8l-3 12 15-18h-8z' fill='%23e8ff00'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- "defer": Skript läuft erst, wenn das HTML komplett eingelesen ist -->
  <script src="script.js" defer></script>
</head>
<body>

  <!-- ==== GLOBALE EFFEKTE ==== -->
  <!-- Scroll-Fortschrittsbalken oben, Scanlines-Overlay und gemeinsame SVG-Farbverläufe -->
  <div class="progress" aria-hidden="true"><div class="progress__bar" id="progress-bar"></div></div>
  <div class="scanlines" aria-hidden="true"></div>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <!-- Glas-Verlauf für die Scherben -->
      <linearGradient id="g-shard" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e8ff00" stop-opacity=".38"/>
        <stop offset=".45" stop-color="#ffffff" stop-opacity=".05"/>
        <stop offset="1" stop-color="#7b2cff" stop-opacity=".32"/>
      </linearGradient>
      <!-- Verlauf für das Thumbnail-Puzzle -->
      <linearGradient id="g-thumb" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2a0f4f"/>
        <stop offset=".6" stop-color="#4b1b8f"/>
        <stop offset="1" stop-color="#e8ff00"/>
      </linearGradient>
    </defs>
  </svg>

  <noscript><p class="noscript">Diese Seite braucht JavaScript, sonst bleibt sie leer. Bitte aktivieren.</p></noscript>

  <!-- ==== HERO ==== -->
  <!-- Riesiger Titel, Scherben im Hintergrund, Blitz, Ticker unten -->
  <header class="hero" id="top" data-scene="hero">
    <div class="hero__shards" aria-hidden="true"></div>
    <svg class="hero__bolt" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path class="bolt" d="M50 0 L50 100"/>
    </svg>
    <div class="hero__flash" aria-hidden="true"></div>
    <div class="hero__inner">
      <p class="hero__brand"><span class="zap" aria-hidden="true"></span><span data-cfg="brand"></span></p>
      <h1 class="hero__title" id="hero-title"></h1>
      <p class="hero__sub" data-cfg="hero.subtitle"></p>
      <p class="hero__hint"><span data-cfg="hero.scrollHint"></span><span class="hero__arrow" aria-hidden="true">↓</span></p>
    </div>
    <div class="ticker" aria-hidden="true"><div class="ticker__track" id="ticker"></div></div>
  </header>

  <main>

    <!-- ==== WARUM ==== -->
    <!-- Große Zeilen schieben sich beim Scrollen zusammen, danach krachen die Ziele rein -->
    <section class="section why" id="warum" data-scene="why">
      <p class="eyebrow" data-cfg="why.eyebrow"></p>
      <div class="why__lines" id="why-lines"></div>
      <div class="why__body">
        <p class="lead" data-reveal data-cfg="why.text"></p>
        <div class="stats" id="why-stats"></div>
      </div>
    </section>

    <div class="crack" data-reveal aria-hidden="true"></div>

    <!-- ==== ABLAUF ==== -->
    <!-- Hauptszene: bleibt stehen (sticky), Scrollen steuert die 5 Schritte + Schnitt-Timeline -->
    <section class="flow" id="ablauf" data-scene="flow">
      <div class="flow__sticky">
        <div class="flow__head">
          <p class="eyebrow" data-cfg="flow.eyebrow"></p>
          <h2 class="h2 glitch" data-reveal data-cfg="flow.title"></h2>
        </div>
        <div class="flow__stage" id="flow-stage">
          <div class="flow__num" id="flow-num" aria-hidden="true">1</div>
          <ol class="flow__cards" id="flow-cards"></ol>
        </div>
        <div class="timeline" aria-hidden="true">
          <div class="timeline__meta">
            <span class="timeline__name" data-cfg="flow.timelineName"></span>
            <span class="timeline__code" id="timecode">00:00</span>
          </div>
          <div class="timeline__track" id="timeline-track">
            <div class="timeline__fill"></div>
            <div class="timeline__playhead"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="crack crack--flip" data-reveal aria-hidden="true"></div>

    <!-- ==== PASST ZUM STREAM ==== -->
    <!-- Fake-Chat fliegt rein, danach knallt der Stempel "Final: Jank" -->
    <section class="section stream" id="stream">
      <div class="split">
        <div>
          <p class="eyebrow" data-cfg="stream.eyebrow"></p>
          <h2 class="h2 glitch" data-reveal data-cfg="stream.title"></h2>
          <p class="lead" data-reveal data-cfg="stream.text"></p>
        </div>
        <div class="chat" data-reveal>
          <div class="chat__head">
            <span class="chat__label" data-cfg="stream.chatLabel"></span>
            <small class="chat__note" data-cfg="stream.chatNote"></small>
          </div>
          <ul class="chat__list" id="chat-list"></ul>
        </div>
      </div>
      <div class="verdict">
        <div class="verdict__box" data-reveal>
          <span class="verdict__who" data-cfg="stream.chatWho"></span>
          <span class="verdict__what" data-cfg="stream.chatRole"></span>
        </div>
        <div class="verdict__arrow" aria-hidden="true">→</div>
        <div class="verdict__box verdict__box--jank" data-reveal>
          <span class="verdict__who" data-cfg="stream.jankWho"></span>
          <span class="verdict__what" data-cfg="stream.jankRole"></span>
        </div>
        <p class="stamp slam" data-reveal data-cfg="stream.stamp"></p>
      </div>
    </section>

    <!-- ==== EXTRA-AUFGABE ==== -->
    <!-- Ein Thumbnail setzt sich beim Scrollen aus Glasscherben zusammen -->
    <section class="section extra" id="extra" data-scene="extra">
      <div class="split">
        <div>
          <p class="eyebrow" data-cfg="extra.eyebrow"></p>
          <h2 class="h2 glitch" data-reveal data-cfg="extra.title"></h2>
          <p class="lead" data-reveal data-cfg="extra.text"></p>
        </div>
        <div class="thumb">
          <svg class="thumb__svg" viewBox="0 0 160 90" aria-hidden="true" focusable="false">
            <g id="thumb-pieces"></g>
          </svg>
          <div class="thumb__label">
            <span class="thumb__play" aria-hidden="true"></span>
            <span data-cfg="extra.thumbLabel"></span>
          </div>
        </div>
      </div>
    </section>

    <div class="crack" data-reveal aria-hidden="true"></div>

    <!-- ==== NACH DEM CONTEST ==== -->
    <!-- Podest mit den Top 5, die Balken wachsen hoch -->
    <section class="section after" id="danach">
      <p class="eyebrow" data-cfg="after.eyebrow"></p>
      <h2 class="h2 glitch" data-reveal data-cfg="after.title"></h2>
      <p class="lead" data-reveal data-cfg="after.text"></p>
      <ol class="podium" id="podium" data-reveal></ol>
    </section>

    <!-- ==== DEIN PART, JANK ==== -->
    <!-- Entscheidungs-Checkliste mit Schaltern (wird nicht gespeichert) -->
    <section class="section part" id="dein-part">
      <p class="eyebrow" data-cfg="part.eyebrow"></p>
      <h2 class="h2 glitch" data-reveal data-cfg="part.title"></h2>
      <p class="lead" data-reveal data-cfg="part.lead"></p>
      <div class="part__grid">
        <fieldset class="panel" data-reveal>
          <legend class="panel__title" data-cfg="part.dealTitle"></legend>
          <div class="panel__list" id="deal-list"></div>
        </fieldset>
        <fieldset class="panel" data-reveal>
          <legend class="panel__title" data-cfg="part.openTitle"></legend>
          <div class="panel__list" id="open-list"></div>
          <p class="panel__count" id="open-count" aria-live="polite"></p>
        </fieldset>
      </div>
      <p class="part__note slam" data-reveal data-cfg="part.note"></p>
      <p class="part__small" data-cfg="part.small"></p>
    </section>

  </main>

  <!-- ==== FOOTER ==== -->
  <!-- Link-Buttons zu den Kanälen + Credit -->
  <footer class="footer" id="links">
    <h2 class="footer__title glitch" data-reveal data-cfg="footer.title"></h2>
    <nav class="footer__links" aria-label="Kanäle von j4nkTTV">
      <a class="btn" data-cfg-href="links.youtube" target="_blank" rel="noopener noreferrer"><span data-cfg="footer.youtube"></span><span class="btn__arrow" aria-hidden="true">↗</span></a>
      <a class="btn" data-cfg-href="links.twitch" target="_blank" rel="noopener noreferrer"><span data-cfg="footer.twitch"></span><span class="btn__arrow" aria-hidden="true">↗</span></a>
      <a class="btn" data-cfg-href="links.instagram" target="_blank" rel="noopener noreferrer"><span data-cfg="footer.instagram"></span><span class="btn__arrow" aria-hidden="true">↗</span></a>
    </nav>
    <p class="footer__facts" id="footer-facts"></p>
    <p class="footer__credit" id="footer-credit"></p>
  </footer>

</body>
</html>
